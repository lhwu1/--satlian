<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原场景特效</title><style>html,body{margin:0;height:100%;background:#111;color:#fff;font:14px system-ui}iframe{border:0;width:100%;height:100%}nav{position:fixed;top:0;left:0;padding:12px;background:#10181edd}button{margin:3px;padding:7px;background:#36515a;color:white;border:0}p{margin:3px}</style></head><body><iframe id="preview" title="原场景特效"></iframe><nav><strong>原场景粒子与贴花</strong><p>原始粒子系统演示，切换项目将重新加载。</p><button data-kind="impact">受击与环境</button><button data-kind="tracer">弹道与枪口</button><button data-kind="explosion">爆炸</button><button data-kind="all">全部</button><p id="status">加载中…</p></nav><script>const frame=document.querySelector('#preview'),status=document.querySelector('#status');let timer;function load(kind){clearInterval(timer);status.textContent='加载中…';frame.src='../公共/原场景运行时.html?show=fx&noaudio=1&tex=256&fxshow='+kind;timer=setInterval(()=>{try{if(frame.contentWindow.__fatal)throw Error(frame.contentWindow.__fatal);if(frame.contentWindow.__ready){clearInterval(timer);status.textContent='已加载';document.documentElement.dataset.assetState='ready'}}catch(e){clearInterval(timer);status.textContent='加载失败：'+e.message;document.documentElement.dataset.assetState='error'}},100)}document.querySelector('nav').onclick=e=>{if(e.target.dataset.kind){document.documentElement.dataset.assetState='loading';load(e.target.dataset.kind)}};load('impact');</script></body></html>
