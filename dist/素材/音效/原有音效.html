<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原有音效素材库</title><style>body{font:15px system-ui,"Microsoft YaHei",sans-serif;background:#111a20;color:#e8eeee;max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:6px}p{color:#abc}button,input{font:inherit}button{background:#264451;border:1px solid #528294;color:white;border-radius:5px;padding:7px;cursor:pointer}input{width:55px}#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.item{background:#1a2a32;border-radius:7px;padding:12px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.item small{grid-column:1/-1;color:#abc}#status{min-height:2em;color:#ffc777}</style></head><body><h1>原场景音效素材库</h1><p>57 种程序合成声音。点击试听或导出 WAV；脉冲响应是混响数据，不是人声。首次使用需点击按钮允许浏览器播放声音。</p><div id="status" role="status">就绪</div><div id="list"></div><script src="音频合成.js"></script><script src="音效库.js"></script></body></html>
