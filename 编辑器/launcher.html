<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沿线地图项目</title>
<style>body{margin:0;background:#0b1013;color:#e8e4da;font:15px system-ui;padding:32px}main{max-width:980px;margin:auto}button{background:#26343a;color:#e8e4da;border:1px solid #58717a;padding:10px 14px;border-radius:4px;cursor:pointer}button.primary{background:#168a7d}.toolbar{display:flex;gap:10px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{border:1px solid #2c444c;padding:16px;border-radius:6px;background:#111b20}.card h3{margin:0 0 10px}.muted{color:#9baeb2;font-size:12px}.actions{display:flex;gap:8px;margin-top:14px}dialog{background:#111b20;color:#e8e4da;border:1px solid #58717a;padding:22px}input{background:#0b1013;color:#fff;border:1px solid #58717a;padding:8px}</style>
<main><h1>地图项目</h1><p class="muted">选择项目后进入编辑器；MCP 配置在独立窗口中管理。</p><div class="toolbar"><button class="primary" id="new">新建地图</button><button id="mcp">配置 MCP</button><button id="refresh">刷新列表</button></div><section id="list" class="grid"></section></main>
<dialog id="nameDialog"><form method="dialog"><h3>新建地图</h3><input id="name" required placeholder="地图名称"><p><button value="cancel">取消</button> <button class="primary" id="create" value="ok">创建并进入编辑器</button></p></form></dialog>
<dialog id="mcpDialog"><h3>MCP 配置</h3><p class="muted">MCP 服务地址由本地服务提供：<code>127.0.0.1:8765</code>。AI 调用必须先读取指导，并只能通过新 id 复制生成素材。</p><p><button id="closeMcp">关闭</button></p></dialog>
<script>
const list=document.querySelector('#list');async function load(){let data={maps:[]};try{const r=await fetch('/api/maps');if(r.ok)data=await r.json();}catch{}list.innerHTML='';if(!data.maps.length){list.innerHTML='<div class="card">暂无地图，点击“新建地图”开始。</div>';return;}for(const m of data.maps){const c=document.createElement('article');c.className='card';c.innerHTML='<h3>'+esc(m.name)+'</h3><div class="muted">对象 '+m.objectCount+' · '+new Date(m.mtime).toLocaleString()+'</div><div class="actions"><button data-open>打开</button><button data-rename>重命名</button><button data-delete>删除</button></div>';c.querySelector('[data-open]').onclick=()=>location.href='index.html?map='+encodeURIComponent(m.file);c.querySelector('[data-rename]').onclick=()=>alert('请在编辑器中另存为新名称后删除旧项目。');c.querySelector('[data-delete]').onclick=async()=>{if(!confirm('确定删除“'+m.name+'”？此操作不可撤销。'))return;const r=await fetch('/api/maps?file='+encodeURIComponent(m.file),{method:'DELETE'});if(r.ok)load();else alert('删除失败');};list.append(c);}}
function esc(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
document.querySelector('#new').onclick=()=>document.querySelector('#nameDialog').showModal();document.querySelector('#create').onclick=e=>{e.preventDefault();const n=document.querySelector('#name').value.trim();if(n)location.href='index.html?new=1&name='+encodeURIComponent(n);};document.querySelector('#mcp').onclick=()=>document.querySelector('#mcpDialog').showModal();document.querySelector('#closeMcp').onclick=()=>document.querySelector('#mcpDialog').close();document.querySelector('#refresh').onclick=load;load();
</script></html>
